<!doctype html>
<html lang="so">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Nafis · Offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #0f172a; --muted: #5b6472; --green: #15803d; --soft: #e8f5ec; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e1711; --fg: #e6efe9; --muted: #9fb0a6; --green: #4ade80; --soft: #15221a; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 26rem; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; }
      h1 { font-size: 1.25rem; margin: 0 0 4px; }
      p { margin: 0 0 4px; color: var(--muted); }
      .en { margin-top: 18px; }
      button { margin-top: 24px; height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #15803d; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 32 32"><path d="M16 6.5c5.6 2.2 8.2 6.6 7.4 11.6-.6 3.9-3.6 6.9-7.4 7.4-3.8-.5-6.8-3.5-7.4-7.4-.8-5 1.8-9.4 7.4-11.6Z" fill="#15803d"/></svg>
      </div>
      <h1>Internet ma jiro</h1>
      <p>Nafis waxay u baahan tahay xiriir si ay u muujiso qoraallada. Isku day mar kale markaad internet hesho.</p>
      <div class="en" lang="en">
        <h1>You're offline</h1>
        <p>Nafis needs a connection to show posts and messages. Try again once you're back online.</p>
      </div>
      <button type="button" onclick="location.reload()">Isku day mar kale · Try again</button>
    </main>
  </body>
</html>
